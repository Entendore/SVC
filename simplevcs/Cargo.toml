[package]
name = "simplevcs"
version = "1.4.0"
edition = "2021"
authors = ["SimpleVCS Team <team@simplevcs.com>"]
license = "MIT OR Apache-2.0"
description = "A distributed, branchless, production-grade VCS with monorepo, tags, ignore files, and video rendering."
readme = "README.md"
repository = "https://github.com/yourusername/simplevcs"
keywords = ["vcs", "git", "branchless", "cli", "distributed"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/tests", "/.github", "/target"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
sled = "0.34"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
walkdir = "2.5"
rayon = "1.10"
regex = "1.10"
thiserror = "1.0"
zstd = "0.13"
memmap2 = "0.9"
fs2 = "0.4"
smallvec = "1.13"
reqwest = { version = "0.12", features = ["blocking", "json"] }
notify = "6.1"
crossterm = "0.27"
ratatui = "0.26"
tokio = { version = "1.37", features = ["full"] }
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls-pemfile = "2.1"
tokio-util = { version = "0.7", features = ["io"] }
image = "0.25"
imageproc = "0.24"
ab_glyph = "0.2"
similar = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ignore = "0.4"
dirs = "5.0"
toml = "0.8"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
indicatif = "0.17"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"

[[bin]]
name = "simplevcs"
path = "src/main.rs"

[lib]
name = "simplevcs"
path = "src/lib.rs"
