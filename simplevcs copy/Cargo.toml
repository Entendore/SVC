[package]
name = "simplevcs"
version = "0.3.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
chrono = "0.4"
walkdir = "2.4"
rayon = "1.8"
memmap2 = "0.9"
thiserror = "1.0"
camino = "1.1"
zstd = "0.13"
globset = "0.4"
jwalk = "0.8"
rustc-hash = "2.0"
mimalloc = "0.1"
dashmap = "5.5"
bincode = "1.3"
derive_more = "0.99"
smallvec = { version = "1.11", features = ["serde"] }
bitflags = { version = "2.4", features = ["serde"] }
typed-builder = "0.18"
tracing = "0.1"
tracing-subscriber = "0.3"
winnow = "0.5"
itertools = "0.12"
strum = { version = "0.25", features = ["derive"] }
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.8"
